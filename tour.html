<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#0A0F1F">

<style>
:root{--ink:#1d2230;--soft:#6b7284;--sun:#38E1FF}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Readex Pro","Segoe UI",Tahoma,sans-serif;color:var(--ink);background:#f1f2f6;overflow:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--sun);outline-offset:4px;border-radius:2px}

/* ---- الافتتاح: الفيلا من الجو ---- */
#intro{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(24px,6vw,76px);color:#fff;background:linear-gradient(0deg,rgba(9,10,14,.62),rgba(9,10,14,0) 46%);transition:opacity .9s}
#intro.gone{opacity:0;pointer-events:none}
#intro h1{margin:0;font-size:clamp(46px,8.4vw,118px);font-weight:500;line-height:1.02;text-shadow:0 2px 34px rgba(0,0,0,.45)}
#intro p{margin:14px 0 0;font-size:clamp(17px,1.7vw,22px);max-width:30em;line-height:1.7;text-shadow:0 1px 14px rgba(0,0,0,.6)}
#enter{align-self:flex-start;margin-top:24px;font-size:19px;font-weight:500;padding:13px 34px;border-radius:999px;background:#fff;color:var(--ink);transition:transform .2s,opacity .3s}
#enter[disabled]{opacity:.55;cursor:default}
#enter:not([disabled]):hover{transform:translateY(-1px)}

/* ---- داخل البيت ---- */
#view{position:fixed;inset:0;background:#0e1016;opacity:0;transition:opacity .9s}
#view.on{opacity:1}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
canvas#c:active{cursor:grabbing}
.veil{position:absolute;inset:0;background:#07080c;opacity:0;pointer-events:none;transition:opacity .38s}
.veil.on{opacity:1}
.hud{position:absolute;pointer-events:none;color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.6)}
.where{top:clamp(16px,3.5vh,34px);inset-inline-start:clamp(18px,4vw,48px)}
.where b{display:block;font-size:clamp(22px,2.6vw,34px);font-weight:500;line-height:1.2}
.where span{display:block;font-size:15.5px;opacity:.85;margin-top:2px}
.where em{display:block;font-style:normal;font-size:14.5px;margin-top:10px;opacity:0;transition:opacity .6s}
.where em.on{opacity:.9}
.ctl{position:absolute;top:clamp(20px,4vh,40px);inset-inline-end:clamp(18px,4vw,48px);display:flex;gap:clamp(16px,2.4vw,30px);align-items:baseline}
.ctl button{color:#fff;font-size:15.5px;text-shadow:0 1px 10px rgba(0,0,0,.6);box-shadow:0 1.5px 0 rgba(255,255,255,.7);padding-bottom:1px}
.ctl button[aria-pressed="true"]{box-shadow:0 1.5px 0 var(--sun);color:#9AF0FF}
.mini{position:absolute;inset-inline-end:clamp(14px,3vw,36px);bottom:clamp(14px,3vh,32px);width:clamp(150px,19vw,250px);background:rgba(255,255,255,.93);border-radius:6px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.35);direction:ltr}
.mini img{display:block;width:100%}
.mini i{position:absolute;width:13px;height:13px;margin:-6.5px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 3px rgba(255,122,26,.3)}
.mini i::after{content:"";position:absolute;left:50%;top:50%;width:0;height:0;border:5px solid transparent;border-bottom:11px solid var(--sun);transform:translate(-50%,-150%)}
.mini em{position:absolute;inset-inline-start:8px;top:5px;font-style:normal;font-size:13px;color:var(--ink);direction:rtl}
.tip{left:50%;bottom:clamp(18px,4vh,40px);transform:translateX(-50%);font-size:15.5px;white-space:nowrap;transition:opacity .8s}
.tip.off{opacity:0}
.lift{position:absolute;left:50%;bottom:clamp(54px,10vh,96px);transform:translate(-50%,12px);display:flex;gap:10px;align-items:center;color:#fff;opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;direction:rtl}
.lift.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.lift span{font-size:15.5px;text-shadow:0 1px 10px rgba(0,0,0,.7);margin-inline-end:6px}
.lift button{font-size:15.5px;padding:8px 18px;border-radius:999px;background:rgba(14,16,22,.62);border:1px solid rgba(255,255,255,.55);color:#fff;backdrop-filter:blur(6px)}
.lift button:hover{background:rgba(255,255,255,.92);color:var(--ink)}
.snap{position:absolute;left:50%;bottom:calc(clamp(54px,10vh,96px) + 58px);transform:translate(-50%,12px);font-size:15.5px;padding:8px 20px;border-radius:999px;background:rgba(14,16,22,.62);border:1px solid rgba(255,255,255,.55);color:#fff;backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .35s,transform .35s}
.snap.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.snap:hover{background:rgba(255,255,255,.92);color:var(--ink)}
.lift button[disabled]{opacity:.38;cursor:default;background:rgba(14,16,22,.4);color:#fff}
.go{position:absolute;left:clamp(18px,5vw,48px);bottom:clamp(20px,4vh,40px);width:74px;height:74px;border-radius:50%;border:1.5px solid rgba(255,255,255,.8);color:#fff;font-size:15px;display:none;touch-action:none;background:rgba(0,0,0,.25)}
@media (pointer:coarse){.go{display:block}.tip{display:none}}
.pad{position:absolute;bottom:calc(clamp(22px,5vh,44px) + env(safe-area-inset-bottom));width:136px;height:136px;border-radius:50%;display:none;touch-action:none;-webkit-user-select:none;user-select:none;
 background:radial-gradient(circle,rgba(16,18,24,.5) 0 56%,rgba(16,18,24,.3) 57% 100%);border:1.5px solid rgba(255,255,255,.32);box-shadow:inset 0 3px 12px rgba(0,0,0,.55),0 8px 22px rgba(0,0,0,.3)}
.pad.l{left:max(20px,env(safe-area-inset-left))}.pad.r{right:max(20px,env(safe-area-inset-right))}
.pad i{position:absolute;left:50%;top:50%;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;transition:transform .14s ease-out;
 background:radial-gradient(circle at 50% 38%,#43464f 0 24%,#2a2c33 25% 62%,#1b1c21 63%);box-shadow:0 5px 12px rgba(0,0,0,.6),inset 0 0 0 3px rgba(255,255,255,.07),inset 0 -4px 7px rgba(0,0,0,.55)}
.pad i::before{content:'';position:absolute;inset:9px;border-radius:50%;background:repeating-radial-gradient(circle,rgba(255,255,255,.08) 0 1px,transparent 1px 4px)}
.pad.on i{transition:none}.pad.on{border-color:rgba(255,255,255,.6)}
@media (pointer:coarse){.go,.mini{display:none!important}.pad{display:block}}
.load{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:18px;background:#0e1016;transition:opacity .8s}
.load.off{opacity:0;pointer-events:none}
@media (max-width:760px){#pick{grid-template-columns:1fr;grid-template-rows:auto 1fr}.intro{gap:14px}.sel span{min-height:0}.lift span{display:none}.lift button{padding:8px 13px}.where{top:calc(clamp(20px,4vh,40px) + 46px)}.lift{bottom:calc(clamp(14px,3vh,32px) + 150px)}.snap{bottom:calc(clamp(14px,3vh,32px) + 206px)}}
@media (prefers-reduced-motion:reduce){.veil,.lift,.snap,#view,#pick{transition-duration:.01s}}
.feat{position:absolute;top:calc(clamp(20px,4vh,40px) + 36px);inset-inline-end:clamp(18px,4vw,48px);display:flex;gap:8px}
.feat button{color:#fff;font-size:14px;padding:6px 13px;border-radius:999px;background:rgba(14,16,22,.42);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);text-shadow:0 1px 6px rgba(0,0,0,.4)}
.feat button[aria-pressed="true"]{background:rgba(250,248,244,.95);color:var(--ink);text-shadow:none}
.sheet{position:absolute;top:calc(clamp(20px,4vh,40px) + 82px);inset-inline-end:clamp(18px,4vw,48px);width:min(372px,calc(100vw - 36px));max-height:calc(100vh - 140px);overflow:auto;background:rgba(250,248,244,.95);color:var(--ink);border-radius:14px;padding:14px 16px;box-shadow:0 14px 44px rgba(0,0,0,.34);display:none;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.sheet.on{display:block}
.sheet .row{display:flex;align-items:center;gap:11px;padding:7px 0}
.sheet .row+.row{border-top:1px solid rgba(29,34,48,.08)}
.sheet .row>i{width:11px;height:11px;border-radius:50%;flex:none}
.sheet .row>div{flex:1;display:flex;flex-direction:column;line-height:1.4}
.sheet .row b{font-weight:600;font-size:15px}.sheet .row span{font-size:12.5px;color:var(--soft)}
.sheet .row button{font-size:13.5px;padding:5px 13px;border-radius:999px;border:1px solid rgba(29,34,48,.22)}
.sheet .chips{display:flex;flex-wrap:wrap;gap:6px}
.sheet .chips button{font-size:13.5px;padding:6px 12px;border-radius:999px;background:rgba(29,34,48,.07)}
.sheet .chips button[aria-pressed="true"]{background:var(--ink);color:#fff}
.sheet p{margin:10px 0 0;font-size:13.5px;line-height:1.65}
.sheet .lbl{margin:0 0 9px;font-size:13px;color:var(--soft)}
.sheet .sw{display:flex;flex-wrap:wrap;gap:12px 10px;margin-bottom:18px}
.sheet .sw button{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--soft);width:44px}
.sheet .sw button i{width:32px;height:32px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.sheet .sw button[aria-pressed="true"] i{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.sheet .sw button[aria-pressed="true"]{color:var(--ink)}
.sheet .sw[aria-disabled="true"]{opacity:.35;pointer-events:none}
.sheet .legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:12px;color:var(--soft)}
.sheet .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:5px;vertical-align:-1px}
.legend .r{background:#e5484d}.legend .a{background:#f0a030}.legend .n{background:#8aa0b8}.legend .g{background:#3fb68b}
.sheet strong{font-weight:600}
@media (max-width:760px){.feat{top:auto;bottom:calc(clamp(22px,5vh,44px) + env(safe-area-inset-bottom));inset-inline-end:auto;right:max(20px,env(safe-area-inset-right));flex-direction:column;align-items:flex-end}
 .sheet{top:auto;bottom:calc(clamp(22px,5vh,44px) + 132px + env(safe-area-inset-bottom));inset-inline-end:auto;left:18px;right:18px;width:auto;max-height:50vh}}
</style>
</head>
<body>

<section id="intro">
  <h1>فيلا خاصة</h1>
  <p>أرضي وأول وملحق علوي على قطعة ٧٣٥ مترًا مربعًا، مبنية من مخططات المشروع بمقاساتها.</p>
  <button id="enter" disabled>تجهيز الفيلا</button>
</section>

<section id="view" class="on">
  <canvas id="c" tabindex="0" aria-label="تجول داخل البيت"></canvas>
  <div class="veil" id="veil"></div>
  <div class="hud where"><b id="room"></b><span id="house"></span><em id="shot">صورة بجودة كاملة. تحرّك لتكمل التجول.</em></div>
  <div class="ctl">
    <button id="night" aria-pressed="false">المساء</button>
    <button id="snd" aria-pressed="true">الصوت</button>
    <button id="back">المنظر الجوي</button>
  </div>
  <div class="feat" id="feat"><button id="fPath" aria-pressed="false">المسارات</button><button id="fPriv" aria-pressed="false">الخصوصية</button><button id="fFin" aria-pressed="false">الخامات</button></div>
  <div class="sheet" id="sheet" role="dialog" aria-live="polite"></div>
  <div class="mini" id="mini"><img id="miniImg" alt=""><i id="dot"></i><em id="miniT"></em></div>
  <div class="hud tip" id="tip">امشِ بالأسهم أو W A S D، واسحب للنظر حولك</div>
  <button class="snap" id="snap">شاهد الصورة</button>
  <div class="lift" id="lift" role="group" aria-label="المصعد"><span>المصعد إلى</span></div>
  <button class="go" id="go" aria-label="تقدّم">تقدّم</button>
  <div class="pad l" id="padL" aria-hidden="true"><i></i></div>
  <div class="load" id="load">تجهيز البيت</div>
</section>

<script type="module">
const AR='٠١٢٣٤٥٦٧٨٩', ar=s=>String(s).replace(/\d/g,d=>AR[d]);
const DIR=new URLSearchParams(location.search).get('d')||'v';

/* ================= البيت ================= */
const $=id=>document.getElementById(id);
const introEl=$('intro'), viewEl=$('view'), loadEl=$('load'), veil=$('veil');
let started=false, running=false, T=null;
const SND={ctx:null,on:true};
$('enter').onclick=()=>{ if(!T)return; try{ if(!SND.ctx){const AC=window.AudioContext||window.webkitAudioContext; if(AC)SND.ctx=new AC();} SND.ctx?.resume(); }catch(e){}
  T.initSound(); introEl.classList.add('gone'); T.fly(); };
$('back').onclick=()=>{ running=false; T?.ambience(false); introEl.classList.remove('gone'); T?.toAir(); };

const FLOORS=[
 {k:'g',h:.5,name:'الدور الأرضي',img:'plans/g.jpg',px:X=>(X+.6)/22,py:S=>(S+.6)/38.2},
 {k:'f',h:4.2,name:'الدور الأول',img:'plans/f.jpg',px:X=>(X-.8)/16.4,py:S=>(S-1)/23.6},
 {k:'r',h:7.8,name:'الملحق العلوي',img:'plans/r.jpg',px:X=>(X-.8)/16.4,py:S=>(S-1)/23.6},
];
const levelOf=y=>y<2.4?0:y<6?1:2;
const NAMES={'D.KIT':'المطبخ','MAID':'غرفة العاملة','TOILET':'دورة المياه','H.W':'المغسلة','W.S.R':'مجلس النساء','M.S.R':'مجلس الرجال','FOYER':'مدخل','FAMILY AREA':'صالة العائلة','DINING ROOM':'غرفة الطعام','STORE':'مستودع','STORAGE':'مخزن','DEWANIA':'الديوانية','DRIVER':'غرفة السائق','BUFFET LAUNDRY':'البوفيه والغسيل','BEDROOM':'غرفة نوم','MASTER BEDROOM':'غرفة النوم الرئيسية','DRESSING':'غرفة الملابس','LOBBY':'الردهة','CORRIDOR':'الممر','CLOSET':'غرفة ملابس'};
const START={x:7.8,y:.12,z:36.3,yaw:0,pitch:.02};
const P={...START,tyaw:START.yaw,tpitch:START.pitch,bob:0}; const keys={}; let fwdHold=false, level=-1, JOY={on:false,mx:0,my:0,lx:0,ly:0};
function reset(){Object.assign(P,START);P.tyaw=P.yaw;P.tpitch=P.pitch;P.ty=START.y;P.bob=0;level=-1;}

async function boot(){
  const THREE=await import('three'); const {GLTFLoader}=await import('three/addons/loaders/GLTFLoader.js');
  const {computeBoundsTree,acceleratedRaycast}=await import('three-mesh-bvh');
  THREE.BufferGeometry.prototype.computeBoundsTree=computeBoundsTree; THREE.Mesh.prototype.raycast=acceleratedRaycast;
  const canvas=$('c');
  const MOBILE=matchMedia('(pointer:coarse)').matches||Math.min(innerWidth,innerHeight)<600;   // الجوال: صور بنصف الدقة وبلا مؤثرات
  const QS=new URLSearchParams(location.search), EXPO=+(QS.get('ex')||1.27);   // AgX كما في صور Blender، فلا يتغير اللون عند الانتقال إلى وضع الصورة
  // كرت الشاشة يحدد مستوى الجودة: الكرت المدمج والجوال يأخذان مسارًا أخف بلا مؤثرات حتى يبقى المشي سلسًا. ?q=0|1|2 يفرض المستوى
  let GPU=''; try{ const pc=document.createElement('canvas').getContext('webgl2'), dbg=pc&&pc.getExtension('WEBGL_debug_renderer_info'); GPU=dbg?pc.getParameter(dbg.UNMASKED_RENDERER_WEBGL):''; pc?.getExtension('WEBGL_lose_context')?.loseContext(); }catch(e){}
  const WEAK=/Intel|UHD|Iris|HD Graphics|Mali|Adreno|PowerVR|SwiftShader|llvmpipe|Basic Render/i.test(GPU)&&!/\bArc\b/i.test(GPU), QF=QS.get('q');
  const FX=QF?QF==='2':!MOBILE&&!WEAK&&!QS.has('nofx');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:!FX,powerPreference:'high-performance'});
  const Q={fx:FX&&renderer.capabilities.isWebGL2,pr:Math.min(devicePixelRatio,FX||MOBILE?1.5:1.25),mirror:FX?1024:MOBILE||QF==='0'?0:512};
  renderer.setPixelRatio(Q.pr);
  renderer.toneMapping=THREE.AgXToneMapping; renderer.toneMappingExposure=EXPO;
  const scene=new THREE.Scene(), cam=new THREE.PerspectiveCamera(68,1,0.05,1800); cam.rotation.order='YXZ';
  const VER=await fetch(`${DIR}/version.json`,{cache:'no-store'}).then(r=>r.json()).then(j=>'?v='+j.v).catch(()=>'');   // يمنع خلط خبز جديد بملفات قديمة مخزنة
  const META=await fetch(`${DIR}/meta.json${VER}`).then(r=>r.json());
  const SHOTS=await fetch(`${DIR}/photo/index.json${VER}`).then(r=>r.ok?r.json():{}).catch(()=>({}));
  const K=META.K||6, EK=Object.keys(META.probes), LV='gfr';
  const tl=new THREE.TextureLoader(), load=(f,srgb=true)=>new Promise((res,rej)=>tl.load(`${DIR}/${f}${VER}`,t=>{if(srgb)t.colorSpace=THREE.SRGBColorSpace;res(t);},undefined,rej));
  const GROUPS=[...'gfrdx'].flatMap(l=>['arch','trim','furn','assets'].map(k=>`${l}_${k}`)).concat('site');
  const pm=new THREE.PMREMGenerator(renderer);

  /* ---- مجموعة الإضاءة: نهار أو مساء (خرائط إضاءة مخبوزة + انعكاسات + سماء) ---- */
  const SETS={};
  async function loadSet(mode){ if(SETS[mode])return SETS[mode]; const b=mode==='night'?'n/':'';
    const [sky,...rest]=await Promise.all([load(b+'sky.jpg'),...EK.map(k=>load(`${b}probe_${k}.jpg`)),...GROUPS.map(g=>load(`${b}${MOBILE?'m/':''}lm_${g}.jpg`))]);
    const env={}; EK.forEach((k,i)=>{const t=rest[i];t.mapping=THREE.EquirectangularReflectionMapping;env[k]=pm.fromEquirectangular(t).texture;t.dispose();});
    sky.mapping=THREE.EquirectangularReflectionMapping;
    const LM={}; GROUPS.forEach((g,i)=>{const t=rest[EK.length+i];t.flipY=false;t.channel=1;t.anisotropy=4;LM[g]=t;});
    return SETS[mode]={sky,env,LM}; }

  /* ---- خامات مصوّرة (Poly Haven, CC0): لون + تضاريس + خشونة/تظليل ---- */
  const TXK=[...new Set(Object.values(META.mats).map(m=>m.t).filter(Boolean))], TX={};
  const txLoad=Promise.all(TXK.flatMap(k=>['d','n','arm'].map(s=>load(`tx/${MOBILE?'m/':''}${k}_${s}.jpg`,s==='d').then(t=>{t.flipY=false;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=s==='d'?8:4;(TX[k]??={})[s]=t;}))));
  const [gltf,day]=await Promise.all([new GLTFLoader().loadAsync(`${DIR}/house.glb${VER}`,e=>{if(e.total)loadEl.textContent=`تجهيز البيت ${ar(Math.round(e.loaded/e.total*100))}٪`;}),loadSet('day'),txLoad]);
  let mode='day', S=day; scene.background=S.sky;

  // انعكاس مصحَّح على حدود الدور، وإحساس بتضاريس الخامة فوق الإضاءة المخبوزة
  const BOX={g:[[2.12,.5,.12],[16.1,3.8,23.7]],f:[[2.12,4.2,2.12],[16.1,7.4,23.7]],r:[[2.12,7.8,2.12],[16.1,11,15.5]],d:[[.12,.35,26.7],[6.7,3.35,34.7]]};
  const HAS_NP=THREE.ShaderChunk.normal_fragment_begin.includes('nonPerturbedNormal'), REFL='reflectVec = inverseTransformDirection( reflectVec, viewMatrix );';
  const HAS_BOX=THREE.ShaderChunk.envmap_physical_pars_fragment.includes(REFL);
  function patch(m,ek,ibl){ const box=HAS_BOX&&BOX[ek], pp=META.probes[ek];
    m.customProgramCacheKey=()=>`v3|${box?1:0}|${ibl?1:0}`;

    for(const m of privGroup.children){ const w=m.userData.w, s=w.v[id]||0, seen=s>.05; if(w.sens===2){prTot++; if(seen){pr++; rooms.add((NAMES[w.name]||w.name)+' ('+LVN[w.k]+')');}}
      m.material.color.setHex(!seen?0x3fb68b:w.sens===2?0xe5484d:w.sens===1?0xf0a030:0x8aa0b8); m.material.opacity=seen?.42+.42*s:.32; }
    privGroup.visible=true; roomEl.textContent=v.name;
    for(const b of sheet.querySelectorAll('[data-view]'))b.setAttribute('aria-pressed',b.dataset.view===id);
    const sum=sheet.querySelector('#privSum'); if(sum)sum.innerHTML=pr?`<strong>${ar(pr)} من ${ar(prTot)}</strong> نوافذ الغرف الخاصة تُرى من هنا: ${[...rooms].slice(0,5).join('، ')}${rooms.size>5?' وغيرها':''}.`:`<strong>لا شيء من الغرف الخاصة يُرى من هنا.</strong> النوافذ الملوّنة بالأخضر مستورة.`; }
  function exitPriv(){ if(stage!=='priv')return; stage='walk'; greens(true); if(privGroup)privGroup.visible=false; Object.assign(P,{x:privSave.x,y:privSave.y,z:privSave.z,ty:privSave.y,yaw:privSave.yaw,tyaw:privSave.yaw,pitch:privSave.pitch,tpitch:privSave.pitch}); cam.fov=privSave.fov; cam.updateProjectionMatrix(); cullKey=null; lastRoom=null; running=true; }
  function privFrame(dt){ const k=Math.min(1,dt*10); P.yaw+=(P.tyaw-P.yaw)*k; P.pitch+=(P.tpitch-P.pitch)*k; cam.position.set(...privView.cam); cam.rotation.set(P.pitch,P.yaw,0);
    renderer.toneMappingExposure=EXPO*(mode==='night'?1.25:.62); PT.value+=dt; paint(); }
  // الخامات: لون كل غرفة على حدة، وباقة تشطيب للبيت كله. الإضاءة مخبوزة بلا لون، فيبقى الضوء صحيحًا مع أي لون
  const TINT={value:Array.from({length:64},()=>new THREE.Vector3(1,1,1))}, CHOICE={}, ORIG={}, TXS={};
  const BASECOL={warm:[.76,.695,.61],calm:[.82,.80,.77],lux:[.64,.58,.51]}, PKG={warm:'دافئة',calm:'هادئة',lux:'فخمة'}; let pkg='warm';
  const PAINTS=[['الأساسي',null],['أبيض دافئ',[.84,.82,.78]],['رمادي حجري',[.60,.59,.56]],['زيتوني',[.52,.56,.44]],['طيني',[.66,.49,.39]],['أزرق رمادي',[.50,.56,.62]]];
  // خريطة الغرف من المخطط (٤ سم): كل نقطة على جدار تأخذ لون الغرفة التي يواجهها الجدار
  const RMW=525, RMH=875, rm=new Uint8Array(RMW*RMH*3);
  META.rooms.forEach((q,i)=>{ const L='gfr'.indexOf(q.k); for(const c of q.cells){ for(let y=Math.max(0,Math.floor(c[2]/.04));y<Math.min(RMH,Math.ceil(c[3]/.04));y++) for(let x=Math.max(0,Math.floor(c[0]/.04));x<Math.min(RMW,Math.ceil(c[1]/.04));x++) rm[(L*RMH+y)*RMW+x]=i+1; } });
  const ROOMMAP=new THREE.DataTexture(rm,RMW,RMH*3,THREE.RedFormat,THREE.UnsignedByteType); ROOMMAP.magFilter=ROOMMAP.minFilter=THREE.NearestFilter; ROOMMAP.generateMipmaps=false; ROOMMAP.needsUpdate=true;
  for(const [key,m] of Object.entries(cache)){ if(key.split('|')[0]!=='wall')continue; const ob=m.onBeforeCompile, ok=m.customProgramCacheKey;
    m.onBeforeCompile=(sh,r)=>{ ob&&ob.call(m,sh,r); sh.uniforms.uTint=TINT; sh.uniforms.uRoomMap={value:ROOMMAP};
      sh.vertexShader='varying vec3 vWp;\nvarying vec3 vWn;\n'+sh.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\n  vWp=(modelMatrix*vec4(transformed,1.)).xyz; vWn=mat3(modelMatrix)*objectNormal;');
      sh.fragmentShader='uniform vec3 uTint[64];\nuniform sampler2D uRoomMap;\nvarying vec3 vWp;\nvarying vec3 vWn;\n'+sh.fragmentShader.replace('#include <map_fragment>',
        '#include <map_fragment>\n  { vec3 q=vWp+normalize(vWn)*.09; int lv=q.y<4.15?0:(q.y<7.75?1:2); ivec2 t=ivec2(int(clamp(q.x/.04,0.,524.)),int(clamp(q.z/.04,0.,874.))+lv*875);\n    diffuseColor.rgb*=uTint[int(texelFetch(uRoomMap,t,0).r*255.+.5)]; }'); };
    m.customProgramCacheKey=()=>(ok?ok.call(m):'')+'|room2'; m.needsUpdate=true; }
  const roomIndex=()=>{ const lv=levelOf(P.y), F=FLOORS[lv]; if(Math.abs(P.y-F.h)>.4)return -1; return META.rooms.findIndex(q=>q.k===F.k&&q.cells.some(c=>P.x>=c[0]-.12&&P.x<=c[1]+.12&&P.z>=c[2]-.12&&P.z<=c[3]+.12)); };
  function applyTints(){ const b=BASECOL[pkg]; for(const v of TINT.value)v.set(1,1,1); for(const [r,i] of Object.entries(CHOICE)){ const t=PAINTS[i][1]; if(t)TINT.value[+r+1].set(t[0]/b[0],t[1]/b[1],t[2]/b[2]); } }
  const texFor=(t,sc)=>{ const key=t+'|'+sc; if(TXS[key])return TXS[key]; const o={}; for(const s of ['d','n','arm']){ const c=TX[t][s].clone(); c.repeat.set(sc,sc); c.needsUpdate=true; o[s]=c; } return TXS[key]=o; };
  function setPkg(p){ const F=META.finishes||{};
    for(const [key,m] of Object.entries(cache)){ const name=key.split('|')[0]; if(!F.lux||!F.lux[name]||!m.isMeshStandardMaterial)continue;
      const o=ORIG[key]??={map:m.map,rm:m.roughnessMap,ao:m.aoMap,nm:m.normalMap,c:m.color.clone(),r:m.roughness,e:m.envMapIntensity,ns:m.normalScale.clone()}, alt=p==='warm'?null:F[p][name];
      if(!alt){ m.map=o.map; m.roughnessMap=o.rm; m.aoMap=o.ao; m.normalMap=o.nm; m.color.copy(o.c); m.roughness=o.r; m.envMapIntensity=o.e; m.normalScale.copy(o.ns); }
      else if(TX[alt.t]){ const t=texFor(alt.t,alt.scale); m.map=t.d; m.roughnessMap=t.arm; m.aoMap=t.arm; m.normalMap=alt.n>0?t.n:null; m.color.setRGB(...alt.c); m.roughness=alt.r; m.envMapIntensity=alt.e; m.normalScale.set(alt.n,alt.n); }
      m.needsUpdate=true; }
    pkg=p; applyTints(); renderFin(); }
  function renderFin(){ if(FEAT!=='fin')return; const i=roomIndex(), b=BASECOL[pkg], nm=i>=0?(NAMES[META.rooms[i].name]||META.rooms[i].name):null, cur=i>=0?(CHOICE[i]||0):-1;
    sheet.innerHTML=`<p class="lbl">${nm?'لون الجدران في '+nm:'ادخل غرفة لتغيير لون جدرانها'}</p><div class="sw" aria-disabled="${!nm}">${PAINTS.map((q,j)=>`<button data-paint="${j}" aria-pressed="${j===cur}" style="--c:${css(q[1]||b)}"><i></i>${q[0]}</button>`).join('')}</div>`+
      `<p class="lbl">باقة التشطيب للبيت كله</p><div class="chips">${Object.entries(PKG).map(([k,n])=>`<button data-pkg="${k}" aria-pressed="${k===pkg}">${n}</button>`).join('')}</div><p>الأرضيات والخشب ولون الجدران معًا، والإضاءة تبقى كما هي.</p>`;
    sheet.dataset.room=i; }
  setInterval(()=>{ if(FEAT==='fin'&&+sheet.dataset.room!==roomIndex())renderFin(); },400);
  // اللوحة
  function openFeat(kind){ if(FEAT===kind){closeFeat();return;} closeFeat(); FEAT=kind; FB[kind].setAttribute('aria-pressed','true'); sheet.className='sheet on';
    if(kind==='path'){ showPaths(true); sheet.innerHTML=PATHS.map(p=>`<div class="row"><i style="background:${css(p.col)}"></i><div><b>${p.name}</b><span>${p.note}</span></div><button data-tour="${p.id}">رافقهم</button></div>`).join(''); }
    else if(kind==='priv'){ sheet.innerHTML=`<p class="lbl">انظر إلى البيت من الخارج</p><div class="chips">${PV.views.map(v=>`<button data-view="${v.id}" aria-pressed="false">${v.name.replace('من ','')}</button>`).join('')}</div><p id="privSum">اختر مكانًا، وتتلوّن النوافذ بما يُرى منها.</p><div class="legend"><span><i class="r"></i>غرفة خاصة تُرى</span><span><i class="a"></i>مكان مشترك يُرى</span><span><i class="n"></i>مجلس يُرى</span><span><i class="g"></i>مستورة</span></div>`; enterPriv('east'); }
    else renderFin(); }
  function closeFeat(){ if(stage==='priv')exitPriv(); TOUR=null; showPaths(false); FEAT=null; sheet.className='sheet'; for(const b of Object.values(FB))b.setAttribute('aria-pressed','false'); }
  FB.path.onclick=()=>openFeat('path'); FB.priv.onclick=()=>openFeat('priv'); FB.fin.onclick=()=>openFeat('fin');
  sheet.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return; const d=b.dataset;
    if(d.tour)startTour(d.tour); else if(d.view)enterPriv(d.view); else if(d.pkg)setPkg(d.pkg);
    else if(d.paint){ const i=roomIndex(); if(i<0)return; CHOICE[i]=+d.paint; applyTints(); renderFin(); } });
  window.__feat={PATHS,privFrame,tourStep,startTour,enterPriv,exitPriv,setPkg,openFeat,closeFeat,roomIndex,CHOICE,applyTints,TINT,get tour(){return TOUR;},get stage(){return stage;}};
  toAir(); loadEl.classList.add('off'); $('enter').disabled=false; $('enter').textContent='ادخل الفيلا';
  let last=performance.now();
  (function frame(now){ requestAnimationFrame(frame); const raw=(now-last)/1000, dt=Math.min(.05,raw); last=now; if(stage==='air'){airFrame(now);return;} if(stage==='fly'){flyFrame(dt);return;} if(stage==='priv'){privFrame(dt);return;} if(!running)return; PT.value+=dt; if(TOUR)tourStep(dt);
    if(!QF&&document.visibilityState==='visible'&&document.hasFocus()){ if(grace>0)grace-=raw; else if(raw<0.12&&still===0){ slow=Math.max(0,slow+(raw>0.03?1:-0.5)); if(slow>45){slow=0;stepDown();} } }   // يُحتسب أثناء المشي فقط، والصفحة ظاهرة
    move(dt); draw(); })(last);
  T={panoMat,sfx,P,V,keys,scene,renderer,floorAt,step:move,hud,draw,setMode,liftGo,doors,photo,mirrors,ambience,META,SHOTS,get mode(){return mode;},get level(){return level;},FX,Q,GPU,snap,stepDown,fly,toAir,initSound,get stage(){return stage;},HEAVY,cam,filmStage,filmShot};window.__villa=T;
}
boot().catch(e=>{console.error(e);loadEl.classList.remove('off');loadEl.textContent='تعذّر تحميل الفيلا. أعد تحميل الصفحة.';});
